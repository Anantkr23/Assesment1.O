services:
  - type: web
    name: assessment-1-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: assessment-1-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://assessment-1-frontend.onrender.com,http://localhost:3000,http://localhost:5173
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app

  - type: web
    name: assessment-1-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: /api
    routes:
      - type: rewrite
        source: /api/*
        destination: https://assessment-1-api.onrender.com/*
      - type: rewrite
        source: /api
        destination: https://assessment-1-api.onrender.com
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: assessment-1-db
    plan: free
    region: singapore
    databaseName: inventory_db
    user: inventory_user
